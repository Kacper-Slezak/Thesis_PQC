apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-deploy
  labels:
    app: k6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k6
  template:
    metadata:
      labels:
        app: k6
      annotations:
        proxy.istio.io/config: |
          proxyStatsMatcher:
            inclusionRegexps:
            - ".*ssl.*"
            - ".*tls.*"
            - "cluster.inbound.*upstream_rq_total"
        sidecar.istio.io/proxyCPU: "2"
        sidecar.istio.io/proxyCPULimit: "2"
        sidecar.istio.io/proxyMemory: "512Mi"
        sidecar.istio.io/proxyMemoryLimit: "512Mi"
    spec:
      nodeSelector:
        role: client
      containers:
      - name: k6
        image: grafana/k6:1.3.0
        command: ["tail", "-f", "/dev/null"]
        resources:
          requests:
            cpu: 4
            memory: 2Gi
          limits:
            cpu: 4
            memory: 2Gi
      securityContext:
        sysctls:
         - name: net.ipv4.ip_local_port_range
           value: "1024 65535"
         - name: net.ipv4.tcp_tw_reuse
           value: "1"
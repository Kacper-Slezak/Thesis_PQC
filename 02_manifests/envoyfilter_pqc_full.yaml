apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: pqc-cipher-suite-full-client
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      app: k6
  configPatches:
  - applyTo: CLUSTER
    match:
      context: SIDECAR_OUTBOUND
      cluster:    
        service: outband|8000|httpbin.default.svc.cluster.local
    patch:
      operation: MERGE
      value: 
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Upstream
            max_session_keys: 0
            common_tls_context:
              tls_params:
                cipher_suites:
                  tls_maximum_protocol_version: TLSv1_3
                  tls_minimum_protocol_version: TLSv1_3
                  ecdh_curves: ["X25519MLKEM768"]
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: pqc-cipher-suite-full-server
  namespace: istio-system
spec:
  workloadSelector:
    labels:     
      app: httpbin
  configPatches:
  - applyTo: FILTER_CHAIN
    match:    
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          destinationport: 8080
          transport_protocol: tls
    patch:
      operation: MERGE
      value:
        transport_socket: 
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Downstream
            disable_stateless_session_resumption: true   
            disable_stateful_session_resumption: true 
            common_tls_context:
              tls_params:
                cipher_suites:
                  tls_maximum_protocol_version: TLSv1_3
                  tls_minimum_protocol_version: TLSv1_3
                  ecdh_curves: ["X25519MLKEM768"] 